title: cmd.exe Setting MSBUILDENABLEALLPROPERTYFUNCTIONS Before MSBuild
id: 51df8698-b5d5-47dc-a203-663aaf752cce
status: experimental
description: |
    Detects cmd.exe invoked with the environment gate MSBUILDENABLEALLPROPERTYFUNCTIONS=1
    on its command line. Setting this variable unlocks MSBuild property functions such as
    $([System.IO.File]::ReadAllText(...)) and $([System.AppDomain]::CurrentDomain.Load(...)),
    which PavinLoader (fake solution "CatalogIngestor", build.cmd) abuses to read an encoded
    payload from Resources.resx and load it as an in-memory assembly. This gate is rarely
    set outside abuse of MSBuild property functions.
references:
    - Verified internal incident report, Trojan.PavinLoader (Malwarebytes family naming), 2026-10-29
    - https://attack.mitre.org/techniques/T1127/001/
author: fotedev
date: 2026-10-29
tags:
    - attack.execution
    - attack.defense-impairment
    - attack.t1127.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\cmd.exe'
    selection_env:
        CommandLine|contains: 'MSBUILDENABLEALLPROPERTYFUNCTIONS=1'
    condition: all of selection_*
falsepositives:
    - Rare legitimate build scripts that deliberately enable all MSBuild property functions; review the script before dismissing
level: high
